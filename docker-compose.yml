services:
  clocker:
    build: .
    image: clocker
    container_name: clocker
    ports:
      # Host port only — the app keeps listening on 3000 inside the container,
      # so nothing else has to change when you move it.
      - "${CLOCKER_PORT:-8090}:3000"
    environment:
      - DATA_FILE=/data/clocker.json
      - AUTH_USER=${AUTH_USER:-}
      - AUTH_PASS=${AUTH_PASS:-}
    volumes:
      - clocker-data:/data
    restart: unless-stopped

volumes:
  clocker-data:
