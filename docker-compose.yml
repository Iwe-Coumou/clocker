services:
  timecard:
    build: .
    container_name: timecard
    ports:
      - "8080:3000"
    environment:
      - DATA_FILE=/data/timecard.json
      - AUTH_USER=${AUTH_USER:-}
      - AUTH_PASS=${AUTH_PASS:-}
    volumes:
      - timecard-data:/data
    restart: unless-stopped

volumes:
  timecard-data:
